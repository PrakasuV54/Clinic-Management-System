<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Password Change — Crescent Clinic</title>
    <link rel="stylesheet" href="/static/css/style.css?v=25">
</head>
<body class="split-login-body">
    <div class="split-login-container">
        <div class="split-image-side">
            <div class="side-image-content"></div>
        </div>
        <div class="split-form-side">
            <div class="split-overlay-content active-view">
                <div class="login-header-v2">
                    <h2 class="role-title" style="color: var(--danger);">Change Default Password</h2>
                    <p class="role-subtitle">For security reasons, you must change your default password before accessing your console.</p>
                </div>

                {% if error %}
                <div class="alert alert-error">
                    {{ error }}
                </div>
                {% endif %}

                <form class="premium-form-v2" method="POST" action="/force_password_change">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="form-group v2-input-group">
                        <label>Logged in as</label>
                        <input type="text" value="{{ username }}" readonly style="background: var(--bg-body); cursor: not-allowed; border-color: transparent;">
                    </div>
                    
                    <div class="form-group v2-input-group">
                        <label for="password">New Password *</label>
                        <input type="password" id="password" name="password" required placeholder="At least 8 characters">
                    </div>

                    <div class="form-group v2-input-group">
                        <label for="confirm_password">Confirm New Password *</label>
                        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Verify new password">
                    </div>

                    <button type="submit" class="btn-premium-action btn-full" style="background: linear-gradient(135deg, var(--danger), #ef4444);">
                        <span>Change Password & Sign In</span>
                    </button>
                </form>
            </div>
            <div style="margin-top: auto; padding-top: 30px; text-align: center; padding-bottom: 10px;">
                <a href="/logout" style="color: #64748b; text-decoration: none; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px; transition: color 0.3s;" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='#64748b'">Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
